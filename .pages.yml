media:
  path: public/images
  output: /images

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: '{fields.title}'
    fields:
      - name: title
        label: Title
        type: string
      - name: image
        label: Image
        type: image
      - name: body
        label: Body
        type: rich-text
  - name: authors
    label: Authors
    type: collection
    path: src/content/authors
    filename: '{fields.title}'
    fields:
      - name: title
        label: Name
        type: string
      - name: image
        label: Avatar
        type: image
      - name: body
        label: Bio
        type: rich-text
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    filename: '{fields.title}'
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Body
        type: rich-text
